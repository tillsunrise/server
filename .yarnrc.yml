nodeLinker: pnp

npmAuthToken: '${NODE_AUTH_TOKEN-}'

npmPublishRegistry: '${NODE_PUBLISH_REGISTRY-}'

plugins:
    - path: .yarn/plugins/@yarnpkg/plugin-interactive-tools.cjs
      spec: '@yarnpkg/plugin-interactive-tools'

yarnPath: .yarn/releases/yarn-3.8.7.cjs

# .yarnrc.yml
packageExtensions:
    # 为 cloudscraper 补充缺失的依赖声明
    cloudscraper@*:
        dependencies:
            request-promise-core: '*'
    # 为 request-promise 补充对等依赖的强制解析
    request-promise@*:
        peerDependencies:
            request: '*'
        peerDependenciesMeta:
            request:
                optional: false

# 可选：如果仍有问题，临时放宽 PnP 严格检查（开发环境可用）
# nodeLinker: node-modules
